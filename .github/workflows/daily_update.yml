name: Daily ETF Update

on:
  schedule:
    - cron: '0 15 * * 1-5'   # 美东上午 10~11 点，发行商应已发布前一日持仓
    - cron: '0 23 * * 1-5'   # 美东下午 6~7 点，ARK 收盘后更新
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETF fetch
        run: python scripts/fetch_holdings.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ALPHARADAR_JGRO_HOLDINGS_URL: ${{ secrets.ALPHARADAR_JGRO_HOLDINGS_URL }}
          ALPHARADAR_JAVA_HOLDINGS_URL: ${{ secrets.ALPHARADAR_JAVA_HOLDINGS_URL }}
          ALPHARADAR_AVUV_HOLDINGS_URL: ${{ secrets.ALPHARADAR_AVUV_HOLDINGS_URL }}
          ALPHARADAR_AVLV_HOLDINGS_URL: ${{ secrets.ALPHARADAR_AVLV_HOLDINGS_URL }}

      - name: Notify on failure
        if: failure()
        run: echo "ETL failed on ${{ github.run_id }} — check logs above"
